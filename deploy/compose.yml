services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: owed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      POSTGRES_DB: owed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U owed -d owed']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://owed:${POSTGRES_PASSWORD}@db:5432/owed
      PUBLIC_BASE_URL: https://${API_DOMAIN}
      CUSTOMER_AGENT_ENDPOINT: http://agents:8001/submit
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 15s
      timeout: 5s
      retries: 5
  agents:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: [python, -m, owed.agents.runtime]
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://owed:${POSTGRES_PASSWORD}@db:5432/owed
      INTERNAL_API_URL: http://api:8000
      AGENT_PUBLIC_ENDPOINT: https://${API_DOMAIN}/submit
      ENVIRONMENT: production
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the API domain}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]
volumes:
  pgdata:
  caddydata:
  caddyconfig:
