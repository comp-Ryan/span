<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1500px;height:900px;background:#F4F5F8;font-family:"Avenir Next",Inter,system-ui,sans-serif;color:#393A3D;overflow:hidden}
.wrap{position:relative;width:1500px;height:900px;display:flex;align-items:center;padding:0 80px;box-sizing:border-box;gap:56px}
.left{width:520px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}.brand img{width:56px;height:56px}.brand b{font-size:30px;letter-spacing:.14em;color:#2CA01C}
h1{font-size:64px;line-height:68px;font-weight:700;letter-spacing:-.02em;margin:0 0 28px}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border:1px solid #D4D7DC;border-radius:40px;font-size:24px;box-shadow:0 8px 24px rgba(57,58,61,.08);margin-bottom:22px}
.wave{display:flex;gap:3px;align-items:center}.wave i{width:4px;border-radius:2px;background:#2CA01C;display:block}
.cta{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;background:#2CA01C;color:#fff;border-radius:30px;font-size:22px;font-weight:600}
.flow{display:flex;align-items:center;gap:0;flex:1}
.col{display:flex;flex-direction:column;gap:14px;width:300px}
.card{background:#fff;border:1px solid #D4D7DC;border-radius:14px;padding:16px 18px;box-shadow:0 6px 20px rgba(57,58,61,.06)}
.card .t{font-size:16px;color:#6B6C72;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card .v{font-size:26px;font-weight:700}
.dots{display:flex;gap:6px;flex-wrap:wrap;width:230px}.dots i{width:14px;height:14px;border-radius:7px;display:block}
.bars{display:flex;align-items:flex-end;gap:5px;height:44px}.bars i{display:block;width:12px;border-radius:3px}
.bracket{width:70px;height:260px;position:relative;flex-shrink:0}
.verdict{width:340px;background:#FFF8EC;border:3px solid #E08A00;border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 14px 40px rgba(224,138,0,.18)}
.verdict .t{font-size:16px;color:#6B6C72;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.verdict .big{font-size:48px;font-weight:700;margin-top:4px}.verdict .sub{font-size:22px;font-weight:600;color:#8A5300;margin-top:2px}
.ic{width:30px;height:30px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
</style></head><body><div class="wrap">
<div class="left">
  <div class="brand"><img src="logo.png"><b>SPAN</b></div>
  <h1>From question to verdict.</h1>
  <div class="pill"><span class="wave"><i style="height:10px"></i><i style="height:22px"></i><i style="height:14px"></i><i style="height:26px"></i><i style="height:12px"></i><i style="height:20px"></i></span>Will I make payroll?</div><br>
  <div class="cta">Ask. See why. Act. →</div>
</div>
<div class="flow">
  <div class="col">
    <div class="card"><div class="t"><span class="ic" style="background:#0077C5"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.7"><rect x="2.5" y="4" width="11" height="8.5" rx="1"/><path d="M2.5 7h11"/></svg></span>Bank balance</div><div class="v">$6,534</div></div>
    <div class="card"><div class="t"><span class="ic" style="background:#2CA01C"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 8.5l3 3 7-7"/></svg></span>204 invoices scored</div><div class="dots">
      <i style="background:#2CA01C"></i><i style="background:#2CA01C"></i><i style="background:#E08A00"></i><i style="background:#2CA01C"></i><i style="background:#2CA01C"></i><i style="background:#D52B1E"></i><i style="background:#2CA01C"></i><i style="background:#E08A00"></i><i style="background:#2CA01C"></i><i style="background:#2CA01C"></i><i style="background:#2CA01C"></i><i style="background:#E08A00"></i>
      <i style="background:#2CA01C"></i><i style="background:#E08A00"></i><i style="background:#2CA01C"></i><i style="background:#2CA01C"></i><i style="background:#D52B1E"></i><i style="background:#2CA01C"></i><i style="background:#2CA01C"></i><i style="background:#E08A00"></i><i style="background:#2CA01C"></i><i style="background:#2CA01C"></i><i style="background:#E08A00"></i><i style="background:#2CA01C"></i></div></div>
    <div class="card"><div class="t"><span class="ic" style="background:#393A3D"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.7"><path d="M2.5 12.5 6 8l3 2.5 4.5-6"/></svg></span>Cash in vs out</div><div class="bars"><i style="height:30px;background:#0077C5"></i><i style="height:40px;background:#2CA01C"></i><i style="height:36px;background:#2CA01C"></i><i style="height:22px;background:#2CA01C"></i><i style="width:10px"></i><i style="height:34px;background:#393A3D"></i><i style="height:26px;background:#8D9096"></i><i style="height:18px;background:#8D9096"></i></div></div>
  </div>
  <svg class="bracket" viewBox="0 0 70 260" fill="none" stroke="#8D9096" stroke-width="2.5"><path d="M0 40 H30 Q40 40 40 50 V120 Q40 130 50 130 H62 M0 130 H40 M0 220 H30 Q40 220 40 210 V140 Q40 130 50 130"/><path d="M56 124 l7 6 -7 6"/></svg>
  <div class="verdict"><div class="t">Verdict</div>
    <svg width="200" height="112" viewBox="0 0 150 84" fill="none"><path d="M12 78 A63 63 0 0 1 48 23" stroke="#D52B1E" stroke-width="12" stroke-linecap="round"/><path d="M52 21 A63 63 0 0 1 98 21" stroke="#E08A00" stroke-width="12" stroke-linecap="round"/><path d="M102 23 A63 63 0 0 1 138 78" stroke="#2CA01C" stroke-width="12" stroke-linecap="round"/><g transform="rotate(14 75 78)"><path d="M75 78 L75 28" stroke="#393A3D" stroke-width="3.5" stroke-linecap="round"/></g><circle cx="75" cy="78" r="5" fill="#393A3D"/></svg>
    <div class="big">Barely.</div><div class="sub">$193 to spare</div></div>
</div>
</div></body></html>
