<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian AP Portal — Supplier Invoice Submission</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; font-family: Verdana, Arial, sans-serif; font-size:13px; color:#222; background:#e9ecef; }
  .top { background:#1f3a5f; color:#fff; padding:10px 24px; font-size:15px; font-weight:bold; }
  .top span { font-weight:normal; font-size:11px; color:#c9d4e3; margin-left:16px; }
  .nav { background:#d7dde5; border-bottom:1px solid #b9c2cf; padding:6px 24px; font-size:11px; }
  .nav a { color:#1f3a5f; margin-right:18px; text-decoration:none; }
  .wrap { max-width:760px; margin:24px auto; background:#fff; border:1px solid #b9c2cf; padding:20px 28px 28px; }
  h1 { font-size:17px; margin:0 0 4px; color:#1f3a5f; }
  .sub { color:#666; font-size:11px; margin-bottom:18px; }
  fieldset { border:1px solid #cfd6df; padding:14px 18px; margin:0 0 16px; }
  legend { font-weight:bold; font-size:12px; color:#1f3a5f; padding:0 6px; }
  label { display:block; font-size:11px; color:#444; margin:10px 0 3px; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=file] {
    width:100%; box-sizing:border-box; padding:6px 7px; border:1px solid #9aa5b4; font-size:13px; background:#fdfdfd; }
  .req { color:#b00020; }
  button { background:#1f3a5f; color:#fff; border:1px solid #122540; padding:8px 20px; font-size:13px; cursor:pointer; margin-top:14px; }
  .note { background:#fff8dc; border:1px solid #e5d58a; padding:8px 10px; font-size:11px; margin-bottom:14px; }
  .ok { background:#eaf6ea; border:1px solid #9ccc9c; padding:16px; margin-bottom:16px; }
  .ok .conf { font-family: "Courier New", monospace; font-size:22px; font-weight:bold; color:#1a5e1a; letter-spacing:1px; }
  table.kv { border-collapse:collapse; width:100%; font-size:12px; }
  table.kv td { border:1px solid #d9dee6; padding:6px 8px; }
  table.kv td:first-child { background:#f3f5f8; width:38%; color:#555; }
  .foot { text-align:center; color:#888; font-size:10px; margin:12px 0 30px; }
</style>
</head>
