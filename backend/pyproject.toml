[project]
name = "owed"
version = "0.1.0"
description = "Owed backend: payroll check assistant on the Intuit QuickBooks hackathon dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pyyaml>=6.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owed"]

[tool.ruff]
line-length = 100
